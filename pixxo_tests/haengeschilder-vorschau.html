<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Pixxo – Hängeschilder-Vorschau</title>
<style>
:root{font-size:16px;color-scheme:light;--foreground:#25251f}*{box-sizing:border-box}body{margin:0;background:#f3efe4;color:#25251f;font:1rem/1.5 system-ui,sans-serif;padding:24px}main{max-width:760px;margin:auto}h1{font-size:1.5rem;font-weight:500;margin:0 0 20px}.viz-controls{display:flex;flex-wrap:wrap;gap:16px}.form-label{display:block;font-size:1rem}.form-select{display:block;margin-top:8px;min-height:44px;max-width:100%;font:inherit;background:#fff;color:#25251f;border:1px solid #686658;border-radius:4px;padding:8px 12px}select:focus-visible{outline:3px solid #245bbb;outline-offset:3px}figcaption{font-size:1rem}p{font-size:1rem}@media(max-width:420px){body{padding:16px}}
</style>
</head>
<body><main><h1>Hängeschilder – detaillierter Pixelentwurf</h1>
<div id="pixxo-sign-study">
  <div class="viz-controls">
    <label class="form-label" for="pixxo-sign-size">Hängeschild
      <select id="pixxo-sign-size" class="form-select">
        <option value="8">Kompakt · Warenzeichen 8 × 8 px</option>
        <option value="16">Groß · Waren-Icon 16 × 16 px</option>
        <option value="0">Ohne Schild</option>
      </select>
    </label>
  </div>
  <div class="sign-buildings">
    <figure><figcaption>Zementwerk</figcaption><canvas width="80" height="72" data-kind="zement" role="img" aria-label="Entwurf eines Zementwerks mit zwei Silos und Hängeschild an der linken Hauswand"></canvas></figure>
    <figure><figcaption>Betonwerk</figcaption><canvas width="80" height="72" data-kind="beton" role="img" aria-label="Entwurf eines Betonwerks mit Mischbehälter, Betonblöcken und Hängeschild an der linken Hauswand"></canvas></figure>
    <figure><figcaption>Glashütte</figcaption><canvas width="80" height="72" data-kind="glas" role="img" aria-label="Entwurf einer Glashütte mit Schmelzofen, Glasplatten und Hängeschild an der linken Hauswand"></canvas></figure>
    <figure><figcaption>Kalkbrennerei</figcaption><canvas width="80" height="72" data-kind="kalk" role="img" aria-label="Entwurf einer Kalkbrennerei mit rundem Schachtofen und Hängeschild an der linken Hauswand"></canvas></figure>
  </div>
</div>
<style>
  #pixxo-sign-study {font-size: max(0.875rem, 1em);color:var(--foreground)}
  #pixxo-sign-study .sign-buildings {display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:20px;margin-top:20px}
  #pixxo-sign-study figure {margin:0;min-width:0}
  #pixxo-sign-study figcaption {margin-bottom:8px}
  #pixxo-sign-study canvas {width:320px;max-width:100%;height:auto;image-rendering:pixelated;display:block}
  @media(max-width:420px){#pixxo-sign-study .sign-buildings{grid-template-columns:1fr}}
</style>
<script>
(() => {
  const root=document.getElementById('pixxo-sign-study');
  const select=root.querySelector('#pixxo-sign-size');
  const edge='#382e23';
  function painter(canvas){
    const c=canvas.getContext('2d');c.imageSmoothingEnabled=false;

    const ln=(x,y,xx,yy,col)=>{x=Math.round(x);y=Math.round(y);xx=Math.round(xx);yy=Math.round(yy);const dx=Math.abs(xx-x),sx=x<xx?1:-1,dy=-Math.abs(yy-y),sy=y<yy?1:-1;let err=dx+dy;while(true){r(x,y,1,1,col);if(x===xx&&y===yy)break;const e=2*err;if(e>=dy){err+=dy;x+=sx}if(e<=dx){err+=dx;y+=sy}}};
    return {c,r,p,ln};
  }
  function good(id){

    const door=(x,y)=>{r(x-1,y-1,9,15,E);r(x,y,7,12,'#8d683e');for(let xx=x+2;xx<x+7;xx+=2)r(xx,y+1,1,10,'#664a31');r(x,y,7,1,'#c2a06b');r(x+5,y+6,1,1,'#e8c77c');r(x-2,y+12,11,2,'#b9ab85');r(x-3,y+14,13,1,'#7c775b')};
    const barrel=(x,y)=>{r(x+1,y,6,10,E);r(x,y+2,8,6,E);r(x+1,y+1,6,8,'#9d7546');r(x+2,y+2,1,6,'#c0a06b');r(x+5,y+2,1,6,'#775333');r(x+1,y+3,6,1,'#545849');r(x+1,y+7,6,1,'#545849');r(x+2,y,4,1,'#d1b781')};

</script>

<p>Entwurf zur Abstimmung. Warenzeichen und Gebäude werden ohne Glättung dargestellt.</p></main></body>
